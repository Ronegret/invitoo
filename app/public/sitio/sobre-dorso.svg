<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 600 400">
  <!-- El dorso del sobre de la portada de invitoo.es, por dentro: el papel
       y el forro, que se ve cuando se abre la solapa. Es la imagen LCP del
       hero: se pinta en el HTML del servidor y no espera a nada. -->
  <defs>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dac7"/>
      <stop offset=".55" stop-color="#ede3d3"/>
      <stop offset="1" stop-color="#f1e9dc"/>
    </linearGradient>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#3a2a1c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="forro" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#efe6d6"/>
      <path d="M0 0H22M0 0V22" stroke="#b08d57" stroke-width=".7" stroke-opacity=".55"/>
      <circle cx="11" cy="11" r="1.3" fill="#8c1d2c" fill-opacity=".35"/>
    </pattern>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .23  0 0 0 0 .17  0 0 0 0 .11  0 0 0 .09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="ventana"><path d="M12 12H588V388H12Z"/></clipPath>
  </defs>
  <rect width="600" height="400" rx="3" fill="url(#papel)"/>
  <!-- El forro: ocupa el dorso entero, con un filete de oro a 1 px. -->
  <g clip-path="url(#ventana)">
    <rect x="12" y="12" width="576" height="376" fill="url(#forro)"/>
    <rect x="12" y="12" width="576" height="376" fill="url(#sombra)"/>
  </g>
  <rect x="12.5" y="12.5" width="575" height="375" fill="none" stroke="#b08d57" stroke-width="1" stroke-opacity=".8"/>
  <rect x="18.5" y="18.5" width="563" height="363" fill="none" stroke="#b08d57" stroke-width=".6" stroke-opacity=".45"/>
  <rect width="600" height="400" rx="3" filter="url(#grano)" fill="#fff"/>
  <path d="M0 1.5H600" stroke="#fff" stroke-opacity=".5"/>
</svg>
